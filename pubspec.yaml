name: lynmeet
description: "LYN MEET — student client for the classroom SFU."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # WebRTC transport + the mediasoup signalling dialect the backend speaks.
  # mediasoup_client_flutter is abandoned (Dart 2 only); this is the maintained
  # fork that tracks flutter_webrtc 1.x.
  mediasfu_mediasoup_client: ^0.1.4
  flutter_webrtc: ^1.6.0

  socket_io_client: ^3.1.6
  provider: ^6.1.5
  wakelock_plus: ^1.6.1
  shared_preferences: ^2.3.0
  app_links: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates the launcher icons for both platforms from one source image.
  # Build-time only — run it after changing the logo, not on every build:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Declared as a directory rather than by filename on purpose: a pubspec that
  # names a file which is not there fails the build outright, and the logo is
  # dropped in rather than generated. Anything added here is picked up without
  # touching this file again.
  assets:
    - assets/

flutter_launcher_icons:
  image_path: "assets/lyn-logo-cross.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # The letterbox behind the icon on Android 8 and up. The logo is a mark on a
  # light ground, so the adaptive background is white rather than the app's
  # dark theme — a dark plate would swallow it on most launchers.
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/lyn-logo-cross.png"
  # Keeps the mark clear of the circular mask launchers crop to. Without it a
  # square logo loses its corners.
  adaptive_icon_foreground_inset: 18
